name: Security and Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile
        run: python -m compileall -q backend
      - name: Unit and security tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s backend/tests -v
