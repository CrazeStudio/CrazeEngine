<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CrazeEngine</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font-family:Arial,system-ui,sans-serif}main{width:min(760px,92%);margin:0 auto;padding-top:16vh}.logo{text-align:center;font-size:52px;font-weight:800;letter-spacing:-2.5px;margin-bottom:28px}.search{display:flex;gap:8px;border:1px solid #dfe1e5;border-radius:28px;padding:6px 7px 6px 20px;box-shadow:0 1px 6px #00000012}.search:focus-within{box-shadow:0 1px 12px #00000020}.search input{flex:1;min-width:0;border:0;outline:0;font-size:17px;background:transparent;color:inherit}.search button{border:0;border-radius:22px;padding:12px 20px;background:#202124;color:#fff;font-weight:600;cursor:pointer}.search button:disabled{opacity:.6}.privacy{text-align:center;color:#70757a;font-size:13px;margin-top:18px}.results{margin:42px auto 70px;width:min(820px,92%)}.result{margin:0 0 28px}.result a{font-size:20px;color:#1558d6;text-decoration:none}.result a:hover{text-decoration:underline}.url{font-size:13px;color:#188038;margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.snippet{font-size:14px;line-height:1.5;color:#4d5156}.status{text-align:center;color:#70757a;padding:30px}@media(max-width:560px){main{padding-top:11vh}.logo{font-size:42px}.result a{font-size:18px}}@media(prefers-color-scheme:dark){body{background:#202124;color:#e8eaed}.search{border-color:#5f6368}.search input{color:#e8eaed}.search button{background:#e8eaed;color:#202124}.privacy,.status{color:#9aa0a6}.url{color:#81c995}.snippet{color:#bdc1c6}.result a{color:#8ab4f8}}</style></head><body><main><div class="logo">CrazeEngine</div><form class="search" id="form"><input id="q" maxlength="200" autocomplete="off" placeholder="Search the web" aria-label="Search the web" spellcheck="false"><button id="btn">Search</button></form><div class="privacy">Privacy-first search · No account · No search history</div></main><section class="results" id="results" hidden></section><script>const f=document.getElementById('form'),q=document.getElementById('q'),r=document.getElementById('results'),b=document.getElementById('btn');function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML}async function search(raw){const query=String(raw||'').trim().replace(/\s+/g,' ').slice(0,200);if(!query)return;r.hidden=false;r.innerHTML='<div class="status">Searching…</div>';b.disabled=true;history.replaceState(null,'','/?q='+encodeURIComponent(query));try{const res=await fetch('/api/search?q='+encodeURIComponent(query),{headers:{Accept:'application/json'}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Search is temporarily unavailable.');const items=Array.isArray(data.results)?data.results:[];r.innerHTML=items.length?items.map(x=>'<article class="result"><a rel="noopener noreferrer" target="_blank" referrerpolicy="no-referrer" href="'+esc(x.url)+'">'+esc(x.title||x.url)+'</a><div class="url">'+esc(x.url)+'</div><div class="snippet">'+esc(x.snippet||'')+'</div></article>').join(''):'<div class="status">No results found.</div>'}catch(e){r.innerHTML='<div class="status">'+esc(e.message)+'</div>'}finally{b.disabled=false}}f.addEventListener('submit',e=>{e.preventDefault();search(q.value)});const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;search(initial)}</script></body></html>
