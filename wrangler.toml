name = "crazeengine"
main = "src/worker.js"
compatibility_date = "2026-09-25"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Set this in Cloudflare secrets/variables to your privacy-respecting search provider.
# Example: an endpoint exposing a SearXNG-compatible /search JSON API.
SEARCH_PROVIDER_URL = ""

[limits]
# Conservative application-level limits reduce runaway requests.
subrequests = 5
cpu_ms = 10
